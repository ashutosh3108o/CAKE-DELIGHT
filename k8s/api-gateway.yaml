apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cake-api-gateway
  template:
    metadata:
      labels:
        app: cake-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cake-api-gateway:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: cake-api-gateway
spec:
  selector:
    app: cake-api-gateway
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30502
  type: NodePort
