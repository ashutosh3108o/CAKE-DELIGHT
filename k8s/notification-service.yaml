apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cake-notification-service
  template:
    metadata:
      labels:
        app: cake-notification-service
    spec:
      containers:
        - name: notification-service
          image: cake-notification-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/notification_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: cake-notification-service
spec:
  selector:
    app: cake-notification-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
